interface:
  display_name: "Stable Character Builder"
  short_description: "Build or structurally rebuild stable single-protagonist roleplay cards"
  default_prompt: "Build, revise, or structurally rebuild a stable single-protagonist roleplay card from this material. For a full-card improvement, preserve canon but do not preserve weak document architecture by default. Separate Character, Runtime, and Scenario; make attention, interpretation, decision logic, knowledge scope, evidence-based change, gates, beats, continuity, anti-drift, lightweight delivery guard, and recovery explicit where they have real jobs. Use the all-English five-part default unless I name another format or language."
